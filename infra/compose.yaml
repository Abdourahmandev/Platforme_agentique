name: asia-platform-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  playwright:
    image: mcr.microsoft.com/playwright/mcp@sha256:690763cbb437ee7233f538a953bb5390bf03791eb5c965b471e59d17a6132fcb
    init: true
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    working_dir: /workspace
    environment:
      HOME: /tmp
    entrypoint: [node, /app/cli.js]
    command: [--headless, --browser, chromium, --no-sandbox, --port, '8931', --host, '0.0.0.0', --allowed-hosts, 'playwright:8931,localhost:8931,127.0.0.1:8931', --isolated, --block-service-workers, --no-webmcp, --idle-timeout, '120000', --output-dir, /workspace/browser-output, --output-max-size, '52428800']
    volumes:
      - type: volume
        source: openclaw-state
        target: /workspace
        volume:
          subpath: workspaces/asia
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 128m
    networks: [browser_control, browser_egress]
    healthcheck:
      test: [CMD, node, -e, 'const s=require("net").connect(8931,"127.0.0.1",()=>{s.end();process.exit(0)});s.on("error",()=>process.exit(1));setTimeout(()=>process.exit(1),3000)']
      interval: 20s
      timeout: 5s
      retries: 6
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    logging: *logging

  openclaw-tools-init:
    profiles: [bootstrap]
    image: ghcr.io/openclaw/openclaw@sha256:97a692e91a99b514318dd43e7925dffdacfc7499f401f842912bf15ccbf083ff
    user: '0:0'
    network_mode: none
    entrypoint: [node, -e, 'require("fs").chownSync("/cache",1000,1000)']
    volumes:
      - openclaw-npm:/cache
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    mem_limit: 128m
    logging: *logging

  speaches:
    profiles: [audio]
    image: ghcr.io/speaches-ai/speaches@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    restart: unless-stopped
    env_file:
      - path: ${ASIA_RUNTIME_DIR}/speaches.env
        required: true
    environment:
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: '2'
      STT_MODEL_TTL: '60'
      ENABLE_UI: 'false'
      LOG_LEVEL: warning
    volumes:
      - speech-models:/home/ubuntu/.cache/huggingface/hub
    ports:
      - '127.0.0.1:18000:8000'
    networks: [agents, outbound, personal]
    healthcheck:
      test: [CMD, python, -c, 'import os, urllib.request; urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8000/health", headers={"Authorization": "Bearer " + os.environ["API_KEY"]}), timeout=4)']
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1024m
    cpus: 2.0
    pids_limit: 150
    logging: *logging

  tts-proxy:
    # Gemini TTS returns WAV only; converts to OGG/Opus for Telegram voice notes.
    # Reuses the pinned Speaches image for its Python and ffmpeg; no local build.
    profiles: [audio]
    image: ghcr.io/speaches-ai/speaches@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    restart: unless-stopped
    user: '1000:1000'
    entrypoint: [python3, /opt/tts-proxy/server.py]
    # Read by the messagerie on the host: loopback only.
    ports: ['127.0.0.1:18080:8080']
    volumes:
      - ./tts-proxy/server.py:/opt/tts-proxy/server.py:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m
    # outbound: Docker publishes ports only for containers on a non-internal network.
    networks: [agents, personal, outbound]
    depends_on:
      litellm: {condition: service_healthy}
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=4)']
      interval: 20s
      timeout: 5s
      retries: 6
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    logging: *logging

  budget-info:
    # Read-only AI budget summary for Dorasso (spend, caps, DeepSeek balance).
    # Holds the keys; returns figures only. Reuses the pinned Speaches image (Python).
    profiles: [audio]
    image: ghcr.io/speaches-ai/speaches@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    restart: unless-stopped
    user: '1000:1000'
    entrypoint: [python3, /opt/budget-info/server.py]
    # Read by the messagerie on the host: loopback only.
    ports: ['127.0.0.1:8091:8080']
    env_file:
      - ${ASIA_RUNTIME_DIR}/litellm.env
    volumes:
      - ./budget-info/server.py:/opt/budget-info/server.py:ro
    read_only: true
    networks: [personal, outbound]
    depends_on:
      litellm: {condition: service_healthy}
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=4)']
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32
    logging: *logging

  openclaw-init:
    profiles: [bootstrap]
    image: ghcr.io/openclaw/openclaw@sha256:97a692e91a99b514318dd43e7925dffdacfc7499f401f842912bf15ccbf083ff
    user: '0:0'
    network_mode: none
    entrypoint: [node, /opt/init-openclaw.mjs]
    volumes:
      - ${ASIA_RUNTIME_DIR}/openclaw:/seed:ro
      - ./init-openclaw.mjs:/opt/init-openclaw.mjs:ro
      - openclaw-state:/state
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    mem_limit: 256m
    logging: *logging

  postgres:
    # PostgreSQL 17.11 (bookworm), multi-architecture manifest.
    image: postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 150
    logging: *logging

  litellm:
    image: ghcr.io/berriai/litellm@sha256:501909ec6f504551f263f82fe8c53cfa34679d5753de507a2df69680a6021ad8
    restart: unless-stopped
    env_file:
      - ${ASIA_RUNTIME_DIR:?Set ASIA_RUNTIME_DIR outside the repository}/litellm.env
    environment:
      PYTHONPATH: /opt/asia
      ASIA_USAGE_PATH: /var/lib/asia/usage.jsonl
      LITELLM_TELEMETRY: 'False'
      DO_NOT_TRACK: '1'
    command: [--config, /opt/asia/config.yaml, --host, 0.0.0.0, --port, '4000']
    volumes:
      - ../gateway:/opt/asia:ro
      - litellm-metrics:/var/lib/asia
    ports:
      - '127.0.0.1:${ASIA_LITELLM_PORT:-14000}:4000'
    networks: [database, agents, outbound, personal, workshop]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:4000/health/liveliness", timeout=4)']
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 90s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 200
    logging: *logging

  openclaw:
    # Official browser image; digest fixes the complete runtime, no local build.
    image: ghcr.io/openclaw/openclaw@sha256:97a692e91a99b514318dd43e7925dffdacfc7499f401f842912bf15ccbf083ff
    init: true
    restart: unless-stopped
    # Respect the gateway's maximum 330-second graceful drain on shutdown.
    stop_grace_period: 6m
    env_file:
      - ${ASIA_RUNTIME_DIR:?Set ASIA_RUNTIME_DIR outside the repository}/openclaw.env
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_GATEWAY_PORT: '18789'
      OPENCLAW_DISABLE_BONJOUR: '1'
      OPENCLAW_NO_RESPAWN: '1'
      NODE_COMPILE_CACHE: /tmp/openclaw-compile-cache
      TZ: America/New_York
    volumes:
      - openclaw-state:/home/node/.openclaw
      # Reinstallable, version-pinned MCP packages stay outside data backups.
      - openclaw-npm:/home/node/.npm
    command: [node, dist/index.js, gateway, --bind, lan, --port, '18789']
    ports:
      - '127.0.0.1:${ASIA_OPENCLAW_PORT:-18789}:18789'
    networks: [agents, outbound, browser_control]
    depends_on:
      litellm: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, dist/docker-healthcheck.js]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 60s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 250
    logging: *logging

networks:
  browser_control: {internal: true}
  browser_egress: {}
  database: {internal: true}
  agents: {internal: true}
  # Personal assistant (Dorasso) <-> LiteLLM only; no route to OpenClaw or Paperclip.
  personal: {internal: true}
  # Paperclip coding runs: Paperclip -> atelier (SSH), atelier -> LiteLLM.
  workshop: {internal: true}
  outbound: {}

volumes:
  postgres-data:
  litellm-metrics:
  openclaw-state:
  openclaw-npm:
  speech-models:

secrets:
  postgres_password:
    file: ${ASIA_RUNTIME_DIR}/secrets/postgres-password
