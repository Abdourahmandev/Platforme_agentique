name: dorasso

# Personal assistant, separate from Decidata: own bot, data, LiteLLM team and budget.
# Reaches LiteLLM only through the internal `personal` network (no OpenClaw/Paperclip).
services:
  hermes:
    # Hermes Agent stable image (Nous Research), pinned by digest.
    image: nousresearch/hermes-agent@sha256:444b42594e7f467425872fc35e077a227d377f0fe0726bc818706d62175fad8b
    command: [gateway, run]
    restart: unless-stopped
    environment:
      HERMES_UID: '1000'
      HERMES_GID: '1000'
      TZ: America/Toronto
    volumes:
      - ${DORASSO_DATA_DIR:?Private Dorasso directory required}:/opt/data
    networks: [personal, search, outbound]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 300
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  searxng:
    # Private metasearch for Dorasso's web_search; reachable only from hermes.
    image: searxng/searxng@sha256:9b61996edcc679fb6665290f95fda15389a14eda6060e41a25c63ab2758f2436
    restart: unless-stopped
    env_file:
      - path: ${DORASSO_DIR:?Private Dorasso directory required}/searxng.env
        required: true
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [search, outbound]
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=4)']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

networks:
  search: {internal: true}
  personal:
    external: true
    name: asia-platform-staging_personal
  outbound: {}
