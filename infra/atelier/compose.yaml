name: atelier

# Execution environment for Paperclip coding agents (Souleiman, Maryam).
# Reachable only from Paperclip on the internal `workshop` network; holds no
# secret besides the per-run LiteLLM key. Outbound internet for dependencies.
services:
  atelier:
    build: .
    image: asia-atelier:opencode-1.18.34
    restart: unless-stopped
    volumes:
      - atelier-host-keys:/etc/ssh/host
      - ${ATELIER_DIR:?Private atelier directory required}/authorized_keys:/etc/ssh/authorized/authorized_keys:ro
      - atelier-work:/work
      # Atelier's own GitHub credential (see set-github-token.sh), used by git and gh.
      - ${ATELIER_DIR}/gh:/home/node/.config/gh:ro
    networks: [workshop, outbound, search]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, SYS_CHROOT, KILL, DAC_OVERRIDE, FOWNER, AUDIT_WRITE]
    tmpfs:
      - /tmp:size=1g,mode=1777
    mem_limit: 3g
    cpus: 4.0
    pids_limit: 1024
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/2222 && head -c 4 <&3 | grep -q SSH']
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  searxng:
    # Web search for the team's research (Saredo, and Souleiman as architect).
    image: searxng/searxng@sha256:9b61996edcc679fb6665290f95fda15389a14eda6060e41a25c63ab2758f2436
    restart: unless-stopped
    env_file:
      - path: ${ATELIER_DIR}/searxng.env
        required: true
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [search, outbound]
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=4)']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200

networks:
  workshop:
    external: true
    name: asia-platform-staging_workshop
  outbound: {}
  search: {internal: true}

volumes:
  atelier-host-keys:
  atelier-work:
